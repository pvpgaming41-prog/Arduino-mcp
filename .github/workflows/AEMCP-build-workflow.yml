name: AEMCP Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      source_dir: ${{ steps.source.outputs.dir }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Find and extract AEMCP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Arduino-Engineering-MCP-Source-only*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Could not find Arduino-Engineering-MCP-Source-only*.zip."
            echo "Upload the source ZIP to the repository root, then commit it."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p aemcp-source
          unzip -q "$ZIP_FILE" -d aemcp-source

          # Support ZIPs that contain either package.json at their root
          # or one enclosing directory.
          if [ ! -f aemcp-source/package.json ]; then
            PACKAGE_FILE="$(find aemcp-source -mindepth 2 -maxdepth 4 -type f -name package.json -print -quit)"
            if [ -z "$PACKAGE_FILE" ]; then
              echo "The ZIP does not contain package.json."
              find aemcp-source -maxdepth 4 -type f -print
              exit 1
            fi
            SOURCE_DIR="$(dirname "$PACKAGE_FILE")"
          else
            SOURCE_DIR="aemcp-source"
          fi

          echo "dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "Using source directory: $SOURCE_DIR"
          ls -la "$SOURCE_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm run check

      - name: Run tests
        working-directory: ${{ steps.source.outputs.dir }}
        run: npm test

  build-and-publish:
    name: Build and publish Docker image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract AEMCP source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'Arduino-Engineering-MCP-Source-only*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found."
            exit 1
          fi
          mkdir -p aemcp-source
          unzip -q "$ZIP_FILE" -d aemcp-source
          if [ ! -f aemcp-source/Dockerfile ]; then
            DOCKER_FILE="$(find aemcp-source -mindepth 2 -maxdepth 4 -type f -name Dockerfile -print -quit)"
            if [ -z "$DOCKER_FILE" ]; then
              echo "Dockerfile not found inside source ZIP."
              exit 1
            fi
            echo "context=$(dirname "$DOCKER_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "context=aemcp-source" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.source.outputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-render:
    name: Trigger optional Render deployment
    needs: build-and-publish
    if: github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (if configured)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
