name: AEMCP Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.locate.outputs.project_dir }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Locate AEMCP project folder
        id: locate
        shell: bash
        run: |
          if [ -f package.json ]; then
            DIR="."
          elif [ -f arduino-engineering-mcp/package.json ]; then
            DIR="arduino-engineering-mcp"
          else
            echo "Could not find package.json at repository root or in arduino-engineering-mcp/."
            echo "Repository files:"
            ls -la
            exit 1
          fi
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run check

      - name: Run tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm test

  container:
    name: Build and publish Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Locate Dockerfile
        id: docker-context
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "context=." >> "$GITHUB_OUTPUT"
          elif [ -f arduino-engineering-mcp/Dockerfile ]; then
            echo "context=arduino-engineering-mcp" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile not found"; ls -la; exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.docker-context.outputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-render:
    name: Trigger optional Render deployment
    needs: container
    if: github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || (echo "Missing RENDER_DEPLOY_HOOK_URL secret" && exit 1)
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
